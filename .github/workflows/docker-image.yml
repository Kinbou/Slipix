name: Docker Image CI

on:
  push:
    branches: 
      - main
      - docker-build

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile -t reg.istry.scaph.technocracy.dev/slipix-frontend:latest
    - name: Push the Docker image
      run: docker push reg.istry.scaph.technocracy.dev/slipix-frontend:latest
